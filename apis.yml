aid: motherduck
url: https://raw.githubusercontent.com/api-evangelist/motherduck/refs/heads/main/apis.yml
name: MotherDuck
x-type: company
description: >-
  MotherDuck is a serverless cloud data warehouse built on DuckDB. Connectivity is via
  DuckDB clients (Python, Node.js, Wasm, Go, JDBC) using access tokens or SSO; the
  service does not publicly document a separate REST management API.
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
tags:
