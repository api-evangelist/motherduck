    name: MotherDuck DuckDB Connection
    humanURL: https://motherduck.com/docs/key-tasks/authenticating-and-connecting-to-motherduck/
    baseURL: md:?token={access_token}
    tags:
      - DuckDB
      - SQL
      - Analytics
    description: >-
      Clients connect to MotherDuck through DuckDB's native protocol using a connection
      string of the form `md:` plus an access token. Officially supported clients include
      DuckDB CLI, Python, Node.js, JDBC, Wasm, and Go. Authentication uses access tokens
      or SSO (Business / Enterprise).
